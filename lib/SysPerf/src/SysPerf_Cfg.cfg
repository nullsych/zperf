/**
 * @file   SysPerf_Cfg.h
 * @brief  SysPerf configuration file to control feature enabling, trace verbosity, etc.
 * @author kvant6ubl
 * @date   May 17, 2024
 *
 */

/**
 * @brief Used to enable/disable features.
 */
#define SP_F_ON                         (1U)
#define SP_F_OFF                        (0U)

/**
 * @brief Tracing main tasks statistics per SP-cycle.
 */
#define SP_CFG_TRACE_MAIN_STAT          SP_F_ON


/**
 * @brief Tracing uptime statistics.
 */
#define SP_CFG_TRACE_UPTIME             SP_F_OFF


/**
 * @brief Tracing history uptime statistic.
 */
#define SP_CFG_TRACE_HISTORY            SP_F_OFF


/**
 * @brief Tracing application/idle total runtimes per SP-cycle.
 */
#define SP_CFG_TRACE_CPU_LOAD           SP_F_OFF
