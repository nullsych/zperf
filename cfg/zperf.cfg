/**
 * @file   zperf.cfg
 * @brief  Configuration file to control feature enabling, trace verbosity, etc.
 * @author nullsych
 * @date   May 17, 2024
 *
 */

/* clang-format off */
#ifndef ZPERF_CFG_CFG
#define ZPERF_CFG_CFG

/**
 * @brief Used to enable/disable features if not before.
 */
#define ZP_CFG_ON                               (1U)
#define ZP_CFG_OFF                              (0U)

/*******************************************************************************************************************
*                                       STATISTIC TRACING CONFIGURATION                                            *
*******************************************************************************************************************/
/**
 * @brief Tracing main Tasks (Threads) statistics per window cycle.
 */
#ifdef CONFIG_ZPERF_TRACE_MAIN_STAT
#define ZP_CFG_TRACE_MAIN_STAT                  ZP_CFG_ON
#else
#define ZP_CFG_TRACE_MAIN_STAT                  ZP_CFG_OFF
#endif

/**
 * @brief Tracing uptime statistics.
 */
#ifdef CONFIG_ZPERF_TRACE_UPTIME
#define ZP_CFG_TRACE_UPTIME                     ZP_CFG_ON
#else
#define ZP_CFG_TRACE_UPTIME                     ZP_CFG_OFF
#endif

/**
 * @brief Tracing history uptime statistic.
 */
#ifdef CONFIG_ZPERF_TRACE_HISTORY
#define ZP_CFG_TRACE_HISTORY                    ZP_CFG_ON
#else
#define ZP_CFG_TRACE_HISTORY                    ZP_CFG_OFF
#endif

/**
 * @brief Tracing application/idle total runtimes per window cycle.
 */
#ifdef CONFIG_ZPERF_TRACE_CPU_LOAD
#define ZP_CFG_TRACE_CPU_LOAD                   ZP_CFG_ON
#else
#define ZP_CFG_TRACE_CPU_LOAD                   ZP_CFG_OFF
#endif


/*******************************************************************************************************************
*                                          RTOS'S THREADS CONFIGURATION                                            *
*******************************************************************************************************************/
/**
 * @brief Define whether RTOS has the system thread (threads that the kernel spawns automatically during system initialization).
 */
#ifdef CONFIG_ZPERF_RTOS_HAS_SYSTEM_TASKS
#define ZP_CFG_RTOS_HAS_SYSTEM_TASKS            ZP_CFG_ON
#else
#define ZP_CFG_RTOS_HAS_SYSTEM_TASKS            ZP_CFG_OFF
#endif


/*******************************************************************************************************************
*                                             RTOS'S ISR CONFIGURATION                                             *
*******************************************************************************************************************/
/**
 * @brief Enable/Disable ISR runtime calculating in the system.
 */
#ifdef CONFIG_ZPERF_ISR_RUNTIME_SUPPORTED
#define ZP_CFG_ISR_RUNTIME_SUPPORTED            ZP_CFG_ON
#else
#define ZP_CFG_ISR_RUNTIME_SUPPORTED            ZP_CFG_OFF
#endif

/**
 * @brief Define whether RTOS has a functionality to distinguish running ISRs in the system at runtime.
 */
#ifdef CONFIG_ZPERF_ISR_RUNTIME_DISTINGUISH
#define ZP_CFG_ISR_RUNTIME_DISTINGUISH          ZP_CFG_ON
#else
#define ZP_CFG_ISR_RUNTIME_DISTINGUISH          ZP_CFG_OFF
#endif

/**
 * @brief Measuring ISR's only total runtimes per window cycle.
 */
#ifdef CONFIG_ZPERF_ISR_TOTAL_RUNTIME_ONLY
#define ZP_CFG_ISR_TOTAL_RUNTIME_ONLY           ZP_CFG_ON
#else
#define ZP_CFG_ISR_TOTAL_RUNTIME_ONLY           ZP_CFG_OFF
#endif


/*******************************************************************************************************************
*                                             RTOS'S IDLE CONFIGURATION                                            *
*******************************************************************************************************************/
/**
 * @brief Define whether RTOS has a Pre/Post routines for Idle Tasks (Threads).
 */
#ifdef CONFIG_ZPERF_RTOS_HAS_IDLE_SWITCHES
#define ZP_CFG_RTOS_HAS_IDLE_SWITCHES           ZP_CFG_ON
#else
#define ZP_CFG_RTOS_HAS_IDLE_SWITCHES           ZP_CFG_OFF
#endif

#endif /* ZPERF_CFG_CFG */
/* clang-format on */