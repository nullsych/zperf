/**
 * @file   nrf_perf_cfg.cfg
 * @brief  Configuration file to control feature enabling, trace verbosity, etc.
 * @author nullsych
 * @date   May 17, 2024
 *
 */

#ifndef NRF_PERF_CFG_CFG
#define NRF_PERF_CFG_CFG

/**
 * @brief Used to enable/disable features if not before.
 */
#define NP_CFG_ON                               (1U)
#define NP_CFG_OFF                              (0U)

/*******************************************************************************************************************
*                                       STATISTIC TRACING CONFIGURATION                                            *
*******************************************************************************************************************/
/**
 * @brief Tracing main Tasks (Threads) statistics per window cycle.
 */
#ifdef CONFIG_NRF_PERF_TRACE_MAIN_STAT
#define NP_CFG_TRACE_MAIN_STAT                  NP_CFG_ON
#else
#define NP_CFG_TRACE_MAIN_STAT                  NP_CFG_OFF
#endif

/**
 * @brief Tracing uptime statistics.
 */
#ifdef CONFIG_NRF_PERF_TRACE_UPTIME
#define NP_CFG_TRACE_UPTIME                     NP_CFG_ON
#else
#define NP_CFG_TRACE_UPTIME                     NP_CFG_OFF
#endif

/**
 * @brief Tracing history uptime statistic.
 */
#ifdef CONFIG_NRF_PERF_TRACE_HISTORY
#define NP_CFG_TRACE_HISTORY                    NP_CFG_ON
#else
#define NP_CFG_TRACE_HISTORY                    NP_CFG_OFF
#endif

/**
 * @brief Tracing application/idle total runtimes per window cycle.
 */
#ifdef CONFIG_NRF_PERF_TRACE_CPU_LOAD
#define NP_CFG_TRACE_CPU_LOAD                   NP_CFG_ON
#else
#define NP_CFG_TRACE_CPU_LOAD                   NP_CFG_OFF
#endif


/*******************************************************************************************************************
*                                          RTOS'S THREADS CONFIGURATION                                            *
*******************************************************************************************************************/
/**
 * @brief Define whether RTOS has the system thread (threads that the kernel spawns automatically during system initialization).
 */
#ifdef CONFIG_NRF_PERF_RTOS_HAS_SYSTEM_TASKS
#define NP_CFG_RTOS_HAS_SYSTEM_TASKS            NP_CFG_ON
#else
#define NP_CFG_RTOS_HAS_SYSTEM_TASKS            NP_CFG_OFF
#endif


/*******************************************************************************************************************
*                                             RTOS'S ISR CONFIGURATION                                             *
*******************************************************************************************************************/
/**
 * @brief Enable/Disable ISR runtime calculating in the system.
 */
#ifdef CONFIG_NRF_PERF_ISR_RUNTIME_SUPPORTED
#define NP_CFG_ISR_RUNTIME_SUPPORTED            NP_CFG_ON
#else
#define NP_CFG_ISR_RUNTIME_SUPPORTED            NP_CFG_OFF
#endif

/**
 * @brief Define whether RTOS has a functionality to distinguish running ISRs in the system at runtime.
 */
#ifdef CONFIG_NRF_PERF_ISR_RUNTIME_DISTINGUISH
#define NP_CFG_ISR_RUNTIME_DISTINGUISH          NP_CFG_ON
#else
#define NP_CFG_ISR_RUNTIME_DISTINGUISH          NP_CFG_OFF
#endif

/**
 * @brief Measuring ISR's only total runtimes per window cycle.
 */
#ifdef CONFIG_NRF_PERF_ISR_TOTAL_RUNTIME_ONLY
#define NP_CFG_ISR_TOTAL_RUNTIME_ONLY           NP_CFG_ON
#else
#define NP_CFG_ISR_TOTAL_RUNTIME_ONLY           NP_CFG_OFF
#endif


/*******************************************************************************************************************
*                                             RTOS'S IDLE CONFIGURATION                                            *
*******************************************************************************************************************/
/**
 * @brief Define whether RTOS has a Pre/Post routines for Idle Tasks (Threads).
 */
#ifdef CONFIG_NRF_PERF_RTOS_HAS_IDLE_SWITCHES
#define NP_CFG_RTOS_HAS_IDLE_SWITCHES           NP_CFG_ON
#else
#define NP_CFG_RTOS_HAS_IDLE_SWITCHES           NP_CFG_OFF
#endif

#endif /* NRF_PERF_CFG_CFG */
