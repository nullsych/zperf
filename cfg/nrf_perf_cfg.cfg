/**
 * @file   nrf_perf_Cfg.cfg
 * @brief  nrf_perf configuration file to control feature enabling, trace verbosity, etc.
 * @author nullsych
 * @date   May 17, 2024
 *
 */

#ifndef NRF_PERF_CFG_CFG
#define NRF_PERF_CFG_CFG

/**
 * @brief Used to enable/disable features or TODO: upd.
 */
#define SP_CFG_ON                               (1U)
#define SP_CFG_OFF                              (0U)

/*******************************************************************************************************************
*                                       STATISTIC TRACING CONFIGURATION                                            *
*******************************************************************************************************************/
/**
 * @brief Tracing main Tasks (Threads) statistics per SP-cycle.
 */
#ifdef CONFIG_NRF_PERF_TRACE_MAIN_STAT
#define SP_CFG_TRACE_MAIN_STAT                  SP_CFG_ON
#else
#define SP_CFG_TRACE_MAIN_STAT                  SP_CFG_OFF
#endif

/**
 * @brief Tracing uptime statistics.
 */
#ifdef CONFIG_NRF_PERF_TRACE_UPTIME
#define SP_CFG_TRACE_UPTIME                     SP_CFG_ON
#else
#define SP_CFG_TRACE_UPTIME                     SP_CFG_OFF
#endif

/**
 * @brief Tracing history uptime statistic.
 */
#ifdef CONFIG_NRF_PERF_TRACE_HISTORY
#define SP_CFG_TRACE_HISTORY                    SP_CFG_ON
#else
#define SP_CFG_TRACE_HISTORY                    SP_CFG_OFF
#endif

/**
 * @brief Tracing application/idle total runtimes per SP-cycle.
 */
#ifdef CONFIG_NRF_PERF_TRACE_CPU_LOAD
#define SP_CFG_TRACE_CPU_LOAD                   SP_CFG_ON
#else
#define SP_CFG_TRACE_CPU_LOAD                   SP_CFG_OFF
#endif


/*******************************************************************************************************************
*                                          RTOS'S THREADS CONFIGURATION                                            *
*******************************************************************************************************************/
/**
 * @brief Define whether RTOS has the system thread (threads that the kernel spawns automatically during system initialization).
 */
#ifdef CONFIG_NRF_PERF_RTOS_HAS_SYSTEM_TASKS
#define SP_CFG_RTOS_HAS_SYSTEM_TASKS            SP_CFG_ON
#else
#define SP_CFG_RTOS_HAS_SYSTEM_TASKS            SP_CFG_OFF
#endif


/*******************************************************************************************************************
*                                             RTOS'S ISR CONFIGURATION                                             *
*******************************************************************************************************************/
/**
 * @brief Enable/Disable ISR runtime calculating in the system.
 */
#ifdef CONFIG_NRF_PERF_ISR_RUNTIME_SUPPORTED
#define SP_CFG_ISR_RUNTIME_SUPPORTED            SP_CFG_ON
#else
#define SP_CFG_ISR_RUNTIME_SUPPORTED            SP_CFG_OFF
#endif

/**
 * @brief Define whether RTOS has a functionality to distinguish running ISRs in the system at runtime.
 */
#ifdef CONFIG_NRF_PERF_ISR_RUNTIME_DISTINGUISH
#define SP_CFG_ISR_RUNTIME_DISTINGUISH          SP_CFG_ON
#else
#define SP_CFG_ISR_RUNTIME_DISTINGUISH          SP_CFG_OFF
#endif

/**
 * @brief Measuring ISR's only total runtimes per SP-cycle.
 */
#ifdef CONFIG_NRF_PERF_ISR_TOTAL_RUNTIME_ONLY
#define SP_CFG_ISR_TOTAL_RUNTIME_ONLY           SP_CFG_ON
#else
#define SP_CFG_ISR_TOTAL_RUNTIME_ONLY           SP_CFG_OFF
#endif


/*******************************************************************************************************************
*                                             RTOS'S IDLE CONFIGURATION                                            *
*******************************************************************************************************************/
/**
 * @brief Define whether RTOS has a Pre/Post routines for Idle Tasks (Threads).
 */
#ifdef CONFIG_NRF_PERF_RTOS_HAS_IDLE_SWITCHES
#define SP_CFG_RTOS_HAS_IDLE_SWITCHES           SP_CFG_ON
#else
#define SP_CFG_RTOS_HAS_IDLE_SWITCHES           SP_CFG_OFF
#endif

#endif /* NRF_PERF_CFG_CFG */
