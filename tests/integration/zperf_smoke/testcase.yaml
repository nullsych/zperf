common:
  tags: zperf
  timeout: 60
  platform_allow:
    - native_sim
    - native_sim/native/64
  integration_platforms:
    - native_sim
    - native_sim/native/64
  harness: console
  harness_config:
    type: multi_line
    ordered: false
    regex:
      # Startup enumeration found the idle and worker threads
      - "zperf_startup: +Name +: idle"
      - "zperf_startup: +Name +: busy_worker"
      # A full window was printed
      - "zperf: # ### Calculations Timeslice: [0-9]+"
      # The worker is busy 2 ms out of every 10 ms, so about 20% load and 80% idle
      # (native_sim runs in simulated time, so this is deterministic)
      - "zperf: # #+ CPU LOAD (1[5-9]|2[0-5])% ### IDLE (7[5-9]|8[0-5])% ### KERNEL [0-5]%"
      # Idle is detected by thread (named rows) and the worker shows up in the history
      - "zperf_history: # idle +IDLE +[0-9]+"
      - "zperf_history: # busy_worker +(IN|OUT) +[0-9]+"

tests:
  # Cycle counter timestamps (default), 10 ms kernel ticks
  zperf.smoke: {}
  # Tick timestamps: needs 100 us ticks to resolve the worker's 2 ms busy periods
  zperf.smoke.uptime_ticks:
    extra_configs:
      - CONFIG_ZPERF_TIMESTAMP_UPTIME_TICKS=y
      - CONFIG_SYS_CLOCK_TICKS_PER_SEC=10000
