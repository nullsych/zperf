# zperf with its defaults. CONFIG_TRACING_USER is left out on purpose: the zperf Kconfig must
# make it the default tracing format, otherwise the build stops with #error.
CONFIG_ZPERF=y
CONFIG_ZPERF_TRACE_HISTORY=y
CONFIG_ZPERF_HISTORY_SIZE=64

# main, idle, logging, sysworkq, busy_worker, zperf_report, plus headroom
CONFIG_ZPERF_USER_TASKS_COUNT=3
CONFIG_ZPERF_SYSTEM_TASKS_COUNT=4

CONFIG_LOG=y
CONFIG_LOG_BUFFER_SIZE=16384

# The default timestamp source is the cycle counter (timing functions). native_sim keeps its
# default 10 ms tick, so the worker's 2 ms busy periods are only visible thanks to it.
