# Enable to use GPIO
CONFIG_GPIO=y

# Enable to use Power Management
CONFIG_PM=y
CONFIG_PM_STATS=y
CONFIG_PM_POLICY_CUSTOM=y
# CONFIG_PM_POLICY_CUSTOM=y

# Enable zperf module
CONFIG_ZPERF=y
# Enable tracing Tasks stat & CPU load
CONFIG_ZPERF_TRACE_MAIN_STAT=y
# Enable tracing CPU load string
CONFIG_ZPERF_TRACE_CPU_LOAD=y
# Enable tracing history
CONFIG_ZPERF_TRACE_HISTORY=y

# Enable to use STDOUT
CONFIG_STDOUT_CONSOLE=y

# Enable to use thread names
CONFIG_THREAD_NAME=y
CONFIG_SCHED_CPU_MASK=y

# Enable to use thread analyzer
# CONFIG_THREAD_ANALYZER=y
# CONFIG_THREAD_ANALYZER_USE_PRINTK=y
# CONFIG_THREAD_ANALYZER_AUTO=y

# Enable trace-hooks (zperf needs TRACING_USER, so other tracing formats like SystemView
# can't be enabled at the same time)
CONFIG_TRACING=y
CONFIG_TRACING_USER=y

# Enable to use get system uptime in system ticks
# CONFIG_SYS_CLOCK_TICKS_PER_SEC=

# Enable iterate over all the threads in the system
CONFIG_THREAD_MONITOR=y

# Enable to use logging (logging/log.h)
CONFIG_LOG=y
CONFIG_LOG_BUFFER_SIZE=10240
# Enable to read logs over SEGGER RTT (in addition to UART)
CONFIG_USE_SEGGER_RTT=y

# Enable to use BLE
CONFIG_BT=y
CONFIG_BT_SMP=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="Zperf Demo"
CONFIG_BT_DIS=y
CONFIG_BT_DIS_PNP=n
CONFIG_BT_BAS=y
CONFIG_BT_HRS=y
CONFIG_BT_DEVICE_APPEARANCE=833
